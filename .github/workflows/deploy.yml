name: Construire et publier

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer le site
        run: |
          node build.mjs
          rm -rf site/tab-suspender
          cp -R static-tab-suspender site/tab-suspender
          rm -rf site/tabsuspender
          cp -R static-tabsuspender-v2 site/tabsuspender
          rm -rf site/alliance-sambo-preview
          cp -R static-alliance-sambo-preview site/alliance-sambo-preview
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
